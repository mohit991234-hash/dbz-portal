<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball Z - Master Universe</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0e;
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a1a24 0%, #0c0c0e 100%);
        }
        header {
            background: linear-gradient(135deg, #ff3c00, #ff8c00);
            padding: 25px;
            box-shadow: 0 5px 25px rgba(255, 60, 0, 0.5);
        }
        header h1 {
            margin: 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0px #000;
            animation: textPulse 1.5s infinite alternate;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .quiz-card {
            background-color: #16161a;
            border: 3px solid #ff4500;
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.2);
            animation: saiyanAura 3s infinite ease-in-out alternate;
        }
        .character-img {
            width: 100%;
            max-width: 260px;
            height: 260px;
            object-fit: contain;
            margin: 15px auto;
            border-radius: 12px;
            border: 2px solid #ff8c00;
            filter: drop-shadow(0px 0px 15px rgba(255, 140, 0, 0.8));
            animation: characterFloat 4s ease-in-out infinite;
        }
        @keyframes textPulse {
            0% { transform: scale(1); text-shadow: 2px 2px 0px #000; }
            100% { transform: scale(1.03); text-shadow: 3px 3px 0px #000, 0 0 20px rgba(255,69,0,0.8); }
        }
        @keyframes saiyanAura {
            0% { border-color: #ff8c00; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); }
            50% { border-color: #ff0000; box-shadow: 0 0 40px rgba(255, 60, 0, 0.7); }
            100% { border-color: #ff8c00; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); }
        }
        @keyframes characterFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .hint {
            color: #ccc;
            font-style: italic;
            margin-bottom: 20px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #ff8c00;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            background: linear-gradient(180deg, #3a3a3e 0%, #222224 100%);
            color: white;
            border: 1px solid #555;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.9); }
        .score-board {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(90deg, #1c1c1e, #ff8c00, #1c1c1e);
            padding: 12px 35px;
            border-radius: 50px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h1>DBZ Super Saiyan Portal</h1>
    </header>

    <div class="container">
        <h2>🔥 Guess The Character!</h2>
        <div class="quiz-card">
            <img id="char-img" class="character-img" src="" alt="DBZ Character">
            <div id="dbz-hint" class="hint">Hint: Loading...</div>
            <div class="options-grid">
                <button onclick="checkAnswer(0)" id="opt0">Option 1</button>
                <button onclick="checkAnswer(1)" id="opt1">Option 2</button>
                <button onclick="checkAnswer(2)" id="opt2">Option 3</button>
                <button onclick="checkAnswer(3)" id="opt3">Option 4</button>
            </div>
        </div>
        <div class="score-board">Score: <span id="score">0</span></div>
    </div>

    <script>
        // Apni repository ki internal links
        const dbzCharacters = [
            { name: "Goku", hint: "He loves eating, fighting, and has an iconic Kamehameha attack!", img: "goku.png" },
            { name: "Vegeta", hint: "The proud Prince of all Saiyans who always wants to surpass Goku.", img: "vegeta.png" },
            { name: "Gohan", hint: "Goku's eldest son who defeated Cell in his Super Saiyan 2 form.", img: "gohan.png" },
            { name: "Piccolo", hint: "Namekian warrior who trained Gohan and wears a heavy white cape.", img: "piccolo.png" }
        ];

        let currentQuestion = {};
        let score = 0;

        function startGame() {
            const randomIndex = Math.floor(Math.random() * dbzCharacters.length);
            currentQuestion = dbzCharacters[randomIndex];
            
            document.getElementById("char-img").src = currentQuestion.img;
            document.getElementById("dbz-hint").innerText = "Hint: " + currentQuestion.hint;

            let options = [currentQuestion.name];
            while(options.length < 4) {
                let randomChar = dbzCharacters[Math.floor(Math.random() * dbzCharacters.length)].name;
                if(!options.includes(randomChar)) { options.push(randomChar); }
            }
            options.sort(() => Math.random() - 0.5);

            for(let i=0; i<4; i++) {
                const btn = document.getElementById("opt" + i);
                btn.innerText = options[i];
                btn.style.background = "linear-gradient(180deg, #3a3a3e 0%, #222224 100%)";
                btn.disabled = false;
            }
        }

        function checkAnswer(optionIndex) {
            const selectedName = document.getElementById("opt" + optionIndex).innerText;
            if(selectedName === currentQuestion.name) {
                score++;
                alert("Sahi Jawab! 🔥 True Saiyan!");
            } else {
                score = 0;
                alert("Galat Jawab! 💥 Try Again!");
            }
            document.getElementById("score").innerText = score;
            startGame();
        }
        startGame();
    </script>
</body>
</html>
